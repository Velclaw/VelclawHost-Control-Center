name: Netlify Preview Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: netlify-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # PR-controlled code is built without any deployment credentials.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build preview
        run: npm run build

      - name: Upload static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: netlify-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
